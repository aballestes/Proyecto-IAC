###############################################################################
# ANSIBLE CONFIGURATION
# Proyecto IaC VMware — Configuración principal de Ansible
###############################################################################

[defaults]
# Inventario dinámico para contingencia (cambiar a produccion/ según el entorno)
inventory          = ./inventory/contingencia
roles_path         = ./roles
collections_paths  = ~/.ansible/collections:/usr/share/ansible/collections
host_key_checking  = False
remote_user        = ansible-user
private_key_file   = ~/.ssh/iaac_rsa
stdout_callback    = yaml
callbacks_enabled  = profile_tasks, timer
gathering          = smart
fact_caching       = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout    = 3600
forks              = 20
timeout            = 30

# Log de auditoría de todas las ejecuciones
log_path = /var/log/ansible/iaac-vsphere.log

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
ssh_args        = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining      = True
control_path    = /tmp/ansible-ssh-%%h-%%p-%%r

[winrm]
scheme   = https
port     = 5986
kerberos_delegation = False

[persistent_connection]
connect_timeout  = 30
command_timeout  = 60
