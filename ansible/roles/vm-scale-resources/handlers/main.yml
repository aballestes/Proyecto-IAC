---
# Handlers — Role vm-scale-resources

- name: "Notify scale completed"
  ansible.builtin.uri:
    url: "{{ notify_webhook_url }}"
    method: POST
    body_format: json
    body:
      text: >
        ✅ IaC Scale Completado: {{ scale_vm_name }} |
        CPU: {{ scale_cpu | default('sin cambio') }} |
        RAM: {{ scale_memory_mb | default('sin cambio') }}MB |
        Disco: {{ scale_add_disk.size_gb | default('N/A') }}GB
    status_code: [200, 201, 202]
  delegate_to: localhost
  when: notify_enabled | default(false) | bool
  ignore_errors: true
